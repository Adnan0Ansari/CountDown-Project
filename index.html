<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⏰ Countdown Timer</h1>
        
        <div class="input-group">
            <label for="seconds">Enter Seconds:</label>
            <input type="number" id="seconds" min="1" placeholder="e.g., 0" value="0">
        </div>

        <button class="btn" id="startBtn">Start Timer</button>

        <div class="button-group">
            <button class="btn-secondary" id="pauseBtn" disabled>Pause</button>
            <button class="btn-secondary" id="resetBtn" disabled>Reset</button>
        </div>

        <div class="display">
            <div class="timer" id="display">00:00</div>
        </div>

        <div class="message" id="message">Enter seconds and click start!</div>
    </div>

     


    <script
        src="script.js">
    </script>

</body>
</html>
